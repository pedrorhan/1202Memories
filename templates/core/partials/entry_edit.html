<div id="entry-{{ entry.id }}" class="pb-10 border-b border-line/50 relative">
    
    <div class="flex justify-between items-start mb-6 font-sans">
        <div class="flex flex-col">
            <span class="text-[10px] uppercase tracking-widest text-ink-dark/70 font-semibold">{{ entry.author.username }}</span>
            <span class="text-[9px] uppercase tracking-widest text-ink-light mt-1 text-ink-blue">Düzenleniyor...</span>
        </div>
    </div>

    <form hx-post="{% url 'core:edit_entry' entry.id %}" hx-target="#entry-{{ entry.id }}" hx-swap="outerHTML" class="flex flex-col gap-4">
        {% csrf_token %}
        <textarea name="content" rows="6" class="w-full bg-transparent border border-line rounded-none focus:ring-0 focus:border-ink-dark text-ink-dark font-serif text-[15px] leading-loose p-4 shadow-inner" required>{{ entry.content }}</textarea>
        
        <div class="flex justify-end gap-4 mt-2 items-center">
            <!-- Cancel Button -->
            <button type="button" hx-get="{% url 'core:get_entry' entry.id %}" hx-target="#entry-{{ entry.id }}" hx-swap="outerHTML" class="text-[10px] uppercase tracking-widest text-ink-light hover:text-ink-dark transition-colors font-sans">
                Vazgeç
            </button>
            
            <!-- Save Button -->
            <button type="submit" class="sanctuary-btn">
                Değişiklikleri İşle
            </button>
        </div>
    </form>

</div>
