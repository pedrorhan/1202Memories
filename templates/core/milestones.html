{% extends "base.html" %}

{% block extra_bg %}
<!-- Dotted Paper Texture for Milestones Only -->
<div class="fixed inset-0 opacity-[0.03] pointer-events-none z-0" style="background-image: url('data:image/svg+xml,%3Csvg width=\'20\' height=\'20\' viewBox=\'0 0 20 20\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'%231C1F26\' fill-opacity=\'1\' fill-rule=\'evenodd\'%3E%3Ccircle cx=\'3\' cy=\'3\' r=\'3\'/%3E%3Ccircle cx=\'13\' cy=\'13\' r=\'3\'/%3E%3C/g%3E%3C/svg%3E');"></div>
{% endblock %}

{% block content %}
<!-- Main Container -->
<div class="relative min-h-screen py-24 md:py-32 font-serif overflow-hidden">
    
    <div class="max-w-5xl mx-auto px-6 md:px-12 relative flex flex-col md:flex-row">
        
        <!-- Left Page: Form -->
        <div class="mb-24 md:mb-0 relative w-full md:w-1/2 md:mr-auto md:pr-16 z-20 pt-8">
            <h2 class="font-serif text-3xl text-ink-dark mb-12 italic">Yeni Bir Gün</h2>
            
            <form hx-post="{% url 'core:milestones_list' %}" hx-target="#milestones-list-container" hx-swap="innerHTML" class="group" onsubmit="this.reset()">
                {% csrf_token %}
                <div class="mb-8">
                    <input type="text" name="title" class="w-full bg-transparent border-b border-line pb-2 focus:ring-0 focus:outline-none focus:border-ink-dark text-ink-dark placeholder-ink-dark/30 font-serif text-xl" placeholder="Başlık (Örn: İlk Tanışma)" required>
                </div>
                
                <div class="mb-8">
                    <input type="date" name="date" class="w-full bg-transparent border-b border-line pb-2 focus:ring-0 focus:outline-none focus:border-ink-dark text-ink-dark/70 font-sans uppercase tracking-widest text-xs" required>
                </div>

                <div class="mb-8">
                    <textarea name="note" rows="3" class="w-full bg-transparent border-b border-line pb-2 focus:ring-0 focus:outline-none focus:border-ink-dark text-ink-dark placeholder-ink-dark/30 font-serif leading-loose text-sm resize-none" placeholder="O güne dair ufak bir not..."></textarea>
                </div>
                
                <button type="submit" class="sanctuary-btn mt-4">Tarihe Yaz</button>
            </form>
        </div>

        <!-- Right Page: List -->
        <div class="relative w-full md:w-1/2 md:ml-auto md:pl-16 z-20 pt-8">
            <h2 class="font-serif text-3xl text-ink-dark mb-12 italic text-right">Dönüm Noktalarımız</h2>
            
            <div id="milestones-list-container" class="flex flex-col gap-10">
                {% include "core/partials/milestones_list_partial.html" %}
            </div>
        </div>

    </div>
</div>
{% endblock %}
